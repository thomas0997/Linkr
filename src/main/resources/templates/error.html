<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Linkr — Something went wrong</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
<style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0d0007;font-family:'Inter',sans-serif;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}

    .card{
    background:rgba(18,0,9,0.9);
    border:0.5px solid rgba(204,34,102,0.25);
    border-radius:20px;
    padding:48px;
    max-width:560px;
    width:100%;
    text-align:center;
    }

    .icon{font-size:48px;margin-bottom:20px}

    h1{
    font-size:28px;
    font-weight:800;
    color:#cc2266;
    margin-bottom:8px;
    }

    .subtitle{
    font-size:14px;
    color:rgba(255,255,255,0.4);
    margin-bottom:32px;
    line-height:1.6;
    }

    /* error detail box */
    .error-box{
    background:rgba(0,0,0,0.4);
    border:0.5px solid rgba(255,50,50,0.2);
    border-radius:12px;
    padding:20px;
    text-align:left;
    margin-bottom:32px;
    }
    .error-type{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.1em;
    color:rgba(255,80,80,0.6);
    margin-bottom:6px;
    }
    .error-message{
    font-size:13px;
    color:rgba(255,255,255,0.6);
    line-height:1.6;
    word-break:break-word;
    }

    .hint{
    font-size:12px;
    color:rgba(255,255,255,0.2);
    margin-bottom:28px;
    line-height:1.6;
    }

    /* buttons */
    .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
    .btn-home{
    background:linear-gradient(135deg,#ff2277,#cc0055);
    border:none;border-radius:10px;
    padding:12px 28px;
    font-size:14px;font-weight:700;color:#fff;
    cursor:pointer;font-family:'Inter',sans-serif;
    text-decoration:none;
    transition:box-shadow .2s;
    }
    .btn-home:hover{box-shadow:0 4px 20px rgba(255,34,119,0.4)}
    .btn-back{
    background:rgba(255,255,255,0.05);
    border:0.5px solid rgba(255,255,255,0.1);
    border-radius:10px;
    padding:12px 28px;
    font-size:14px;color:rgba(255,255,255,0.5);
    cursor:pointer;font-family:'Inter',sans-serif;
    text-decoration:none;
    transition:all .2s;
    }
    .btn-back:hover{background:rgba(255,255,255,0.08);color:#fff}
</style>
</head>
<body>

<div class="card">
    <div class="icon">⚠️</div>
    <h1>Something went wrong</h1>
    <p class="subtitle">
    An unexpected error occurred. The full details have been printed to the terminal.
    </p>

    <div class="error-box">
    <div class="error-type" th:text="${errorType}">ErrorType</div>
    <div class="error-message" th:text="${errorMessage}">Error message will appear here.</div>
    </div>

    <p class="hint">Check your terminal for the full stack trace.<br>If this keeps happening, review the logs above the error.</p>

    <div class="btns">
    <a class="btn-home" href="/home">Go Home</a>
    <a class="btn-back" onclick="history.back()">← Go Back</a>
    </div>
</div>

</body>
</html>
