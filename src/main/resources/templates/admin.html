
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Linkr — Admin</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0d0007;font-family:'Inter',sans-serif;color:#fff;padding:40px}
    h1{font-size:24px;margin-bottom:8px;color:#cc2266}
    .msg{font-size:13px;color:rgba(255,255,255,0.5);margin-bottom:24px}
    .err{color:#ff4444}
    .ok{color:#44ff99}
    .btn{background:#cc2266;border:none;border-radius:8px;padding:10px 20px;color:#fff;font-size:14px;cursor:pointer;font-weight:600;margin-right:8px}
    .btn.secondary{background:rgba(204,34,102,0.15);border:0.5px solid rgba(204,34,102,0.3)}
    .btn.danger{background:rgba(255,50,50,0.2);border:0.5px solid rgba(255,50,50,0.3)}
    .btn.small{padding:6px 12px;font-size:12px;margin:0}
    .card{background:rgba(18,0,9,0.9);border:0.5px solid rgba(204,34,102,0.2);border-radius:16px;padding:24px;margin-bottom:24px;max-width:700px}

    /* ── image slots ── */
    .imgs{display:flex;gap:12px;margin-bottom:16px}
    .img-slot{flex:1;max-width:200px}
    .img-preview{
      aspect-ratio:1;border-radius:12px;overflow:hidden;
      border:0.5px solid rgba(204,34,102,0.2);
      background:rgba(204,34,102,0.06);
      margin-bottom:8px;
    }
    .img-preview img{width:100%;height:100%;object-fit:cover;display:block}
    .img-preview .placeholder{
      width:100%;height:100%;min-height:140px;
      display:flex;align-items:center;justify-content:center;
      color:rgba(255,255,255,0.2);font-size:12px;text-align:center;padding:8px;
    }

    /* editable keyword row */
    .keyword-row{display:flex;gap:6px;align-items:center}
    .keyword-input{
      flex:1;background:rgba(204,34,102,0.08);
      border:0.5px solid rgba(204,34,102,0.3);border-radius:6px;
      padding:6px 10px;color:#fff;font-size:12px;font-family:'Inter',sans-serif;
      outline:none;
    }
    .keyword-input:focus{border-color:#cc2266}
    .refetch-status{font-size:11px;margin-top:4px;min-height:14px;color:rgba(255,255,255,0.4)}

    .field{margin-bottom:12px;font-size:13px}
    .field label{color:rgba(255,255,255,0.4);font-size:11px;text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:4px}
    .field span{color:#fff}
    .level-input{background:rgba(204,34,102,0.08);border:0.5px solid rgba(204,34,102,0.3);border-radius:8px;padding:8px 12px;color:#fff;font-size:14px;width:80px}
    .actions{display:flex;align-items:center;gap:8px;margin-top:16px}

    /* hidden imageUrl inputs that JS updates */
    input[type=hidden]{}
  </style>
</head>
<body>

  <h1>Linkr Admin Panel</h1>

  <!-- Status message — works for both direct render AND flash redirect -->
  <p class="msg"
     th:classappend="${message != null and message.startsWith('✓')} ? 'ok' : ''"
     th:text="${message != null ? message : 'Ready to generate.'}">Ready to generate.</p>
  <p class="msg err" th:if="${error}" th:text="${error}"></p>

  <!-- Manual entry form -->
<div class="card" th:if="${generated == null}" id="manual-card">
    <div style="font-size:13px;color:rgba(255,255,255,0.5);margin-bottom:16px">Manual Question Entry</div>

    <form method="POST" th:action="@{/admin/approve}">
        <div class="imgs">
            <div class="img-slot">
                <div class="img-preview"><img id="manual-img1" src="" style="display:none"><div class="placeholder" id="manual-ph1">Paste URL below</div></div>
                <input class="keyword-input" type="text" name="imageUrl1" id="manual-url1" placeholder="Image 1 URL" oninput="previewManual(1)">
            </div>
            <div class="img-slot">
                <div class="img-preview"><img id="manual-img2" src="" style="display:none"><div class="placeholder" id="manual-ph2">Paste URL below</div></div>
                <input class="keyword-input" type="text" name="imageUrl2" id="manual-url2" placeholder="Image 2 URL" oninput="previewManual(2)">
            </div>
            <div class="img-slot">
                <div class="img-preview"><img id="manual-img3" src="" style="display:none"><div class="placeholder" id="manual-ph3">Paste URL below</div></div>
                <input class="keyword-input" type="text" name="imageUrl3" id="manual-url3" placeholder="Image 3 URL" oninput="previewManual(3)">
            </div>
        </div>

        <div class="field">
            <label>Answer</label>
            <input class="keyword-input" style="width:100%;font-size:14px;padding:8px 12px" type="text" name="answer" placeholder="e.g. Capital Cities" required>
        </div>
        <div class="field">
            <label>Clue 1</label>
            <input class="keyword-input" style="width:100%" type="text" name="clue1" placeholder="Vague category hint" required>
        </div>
        <div class="field">
            <label>Clue 2</label>
            <input class="keyword-input" style="width:100%" type="text" name="clue2" placeholder="Narrows it down" required>
        </div>
        <div class="field">
            <label>Clue 3</label>
            <input class="keyword-input" style="width:100%" type="text" name="clue3" placeholder="Almost gives it away" required>
        </div>

        <div class="actions">
            <div>
                <label style="font-size:12px;color:rgba(255,255,255,0.4)">Level:</label>
                <input class="level-input" type="number" name="levelNumber" min="1" th:value="${nextLevel}">
            </div>
            <button class="btn" type="submit">✓ Save Question</button>
        </div>
    </form>
</div>

<!-- Generate button -->
<form method="POST" th:action="@{/admin/generate}" th:if="${generated == null}" style="margin-top:12px">
    <button class="btn secondary" type="submit">Generate with AI ↗</button>
</form>

  <!-- ── Review card ── -->
  <div class="card" th:if="${generated != null}" id="review-card">

    <!-- 3 image slots — each has: preview, editable keyword, re-fetch button, hidden URL input -->
    <div class="imgs">

      <!-- Slot 1 -->
      <div class="img-slot">
        <div class="img-preview">
          <img id="img1" th:src="${generated.imageUrl1}" alt="Image 1"
               onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"
               style="display:block">
          <div class="placeholder" style="display:none">No image</div>
        </div>
        <div class="keyword-row">
          <input class="keyword-input" id="kw1" type="text" th:value="${generated.imageKeyword1}" placeholder="keyword">
          <button class="btn small" type="button" onclick="refetch(1)">↺</button>
        </div>
        <div class="refetch-status" id="rs1"></div>
        <!-- hidden — approve form reads this; JS updates it on re-fetch -->
        <input type="hidden" id="url1" name="imageUrl1-live" th:value="${generated.imageUrl1}">
      </div>

      <!-- Slot 2 -->
      <div class="img-slot">
        <div class="img-preview">
          <img id="img2" th:src="${generated.imageUrl2}" alt="Image 2"
               onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"
               style="display:block">
          <div class="placeholder" style="display:none">No image</div>
        </div>
        <div class="keyword-row">
          <input class="keyword-input" id="kw2" type="text" th:value="${generated.imageKeyword2}" placeholder="keyword">
          <button class="btn small" type="button" onclick="refetch(2)">↺</button>
        </div>
        <div class="refetch-status" id="rs2"></div>
        <input type="hidden" id="url2" name="imageUrl2-live" th:value="${generated.imageUrl2}">
      </div>

      <!-- Slot 3 -->
      <div class="img-slot">
        <div class="img-preview">
          <img id="img3" th:src="${generated.imageUrl3}" alt="Image 3"
               onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"
               style="display:block">
          <div class="placeholder" style="display:none">No image</div>
        </div>
        <div class="keyword-row">
          <input class="keyword-input" id="kw3" type="text" th:value="${generated.imageKeyword3}" placeholder="keyword">
          <button class="btn small" type="button" onclick="refetch(3)">↺</button>
        </div>
        <div class="refetch-status" id="rs3"></div>
        <input type="hidden" id="url3" name="imageUrl3-live" th:value="${generated.imageUrl3}">
      </div>

    </div><!-- /imgs -->

    <!-- Keywords row (read-only display, editing happens above) -->
    <div class="field">
      <label>Original Keywords</label>
      <span th:text="${generated.imageKeyword1 + ' | ' + generated.imageKeyword2 + ' | ' + generated.imageKeyword3}"></span>
    </div>
    <!-- ── Approve form wraps editable fields so they submit directly ── -->
    <form method="POST" th:action="@{/admin/approve}" id="approve-form">

      <!-- Answer — editable -->
      <div class="field">
        <label>Answer</label>
        <input class="keyword-input" 
              style="width:100%;font-size:14px;padding:8px 12px"
              type="text" 
              name="answer" 
              id="editable-answer"
              th:value="${generated.answer}">
      </div>

      <!-- Clues — editable -->
      <div class="field">
        <label>Clue 1</label>
        <input class="keyword-input" 
              style="width:100%" 
              type="text" 
              name="clue1" 
              th:value="${generated.clue1}">
      </div>
      <div class="field">
        <label>Clue 2</label>
        <input class="keyword-input" 
              style="width:100%" 
              type="text" 
              name="clue2" 
              th:value="${generated.clue2}">
      </div>
      <div class="field">
        <label>Clue 3</label>
        <input class="keyword-input" 
              style="width:100%" 
              type="text" 
              name="clue3" 
              th:value="${generated.clue3}">
      </div>

  <!-- Image URLs — hidden, JS keeps these in sync via refetch() -->
  <input type="hidden" name="imageUrl1" id="approve-url1" th:value="${generated.imageUrl1}">
  <input type="hidden" name="imageUrl2" id="approve-url2" th:value="${generated.imageUrl2}">
  <input type="hidden" name="imageUrl3" id="approve-url3" th:value="${generated.imageUrl3}">

  <div class="actions" style="margin-top:16px">
      <div>
        <label style="font-size:12px;color:rgba(255,255,255,0.4)">Level:</label>
        <input class="level-input" type="number" name="levelNumber" min="1" value="1">
      </div>
      <div>
        <label style="font-size:12px;color:rgba(255,255,255,0.4)">Theme (optional):</label>
        <input class="keyword-input" type="text" name="theme"
               placeholder="e.g. sports, countries, food" style="width:180px">
      </div>
      <button class="btn" type="submit">✓ Approve</button>
    </div>

  </form>

  <div class="actions" style="margin-top:10px">

    <form method="POST" th:action="@{/admin/reject}" style="display:inline" id="reject-form">
      <input type="hidden" name="answer" id="reject-answer-input">
      <input type="hidden" name="reason" id="reject-reason-input">
      <input type="hidden" name="theme"  id="reject-theme-input">
      <button class="btn danger" type="button" onclick="submitRejectWithReason()">✗ Reject</button>
    </form>

    <form method="POST" th:action="@{/admin/regenerate}" style="display:inline" id="regen-form">
      <input type="hidden" name="answer" id="regen-answer-input"
             th:value="${generated != null ? generated.answer : ''}">
      <input type="hidden" name="reason" id="regen-reason-input">
      <input type="hidden" name="theme"  id="regen-theme-input">
      <button class="btn secondary" type="button" onclick="submitRegenWithReason()">↺ Regenerate</button>
    </form>

    <p>Active players (last 5 min): <strong th:text="${activePlayers}">0</strong></p>

  </div>


  </div><!-- /card -->

<script>
  // Re-fetches one image slot from Unsplash via the new /admin/refetch-image endpoint.
  // Updates the <img> preview AND the hidden approve-form input so the right URL gets saved.
  async function refetch(slot) {
    const kw    = document.getElementById('kw' + slot).value.trim();
    const img   = document.getElementById('img' + slot);
    const status = document.getElementById('rs' + slot);
    const approveInput = document.getElementById('approve-url' + slot);

    if (!kw) { status.textContent = 'Enter a keyword first.'; return; }

    status.style.color = 'rgba(255,255,255,0.4)';
    status.textContent = 'Fetching…';

    try {
      const res  = await fetch('/admin/refetch-image?keyword=' + encodeURIComponent(kw));
      const data = await res.json();

      if (data.error) {
        status.style.color = '#ff4444';
        status.textContent = data.error;
        return;
      }

      // Update preview
      img.src = data.url;
      img.style.display = 'block';
      img.nextElementSibling.style.display = 'none'; // hide placeholder

      // Sync into approve form so the new URL gets submitted
      approveInput.value = data.url;

      status.style.color = '#44ff99';
      status.textContent = '✓ Updated';
    } catch (e) {
      status.style.color = '#ff4444';
      status.textContent = 'Network error';
    }
  }

    // Copies the current (possibly edited) answer into the reject form before submitting
function submitRejectWithReason() {
    const answer = document.getElementById('editable-answer').value;
    const reason = prompt('Why reject? (helps train the AI)\ne.g. "wordplay too obscure", "images don\'t match", "too similar to previous question"') || '';
    const theme  = prompt('What theme is this? (optional)\ne.g. "sports", "countries", "food", "movies"') || '';

    document.getElementById('reject-answer-input').value = answer;
    document.getElementById('reject-reason-input').value = reason;
    document.getElementById('reject-theme-input').value  = theme;
    document.getElementById('reject-form').submit();
}

function submitRegenWithReason() {
    const answer = document.getElementById('editable-answer').value;
    const reason = prompt('Why regenerate? (optional)\ne.g. "images too ambiguous", "answer too obvious"') || '';
    const theme  = prompt('Theme to avoid? (optional)\ne.g. "sports", "countries"') || '';

    document.getElementById('regen-answer-input').value = answer;
    document.getElementById('regen-reason-input').value = reason;
    document.getElementById('regen-theme-input').value  = theme;
    document.getElementById('regen-form').submit();
}

function previewManual(slot) {
    const url = document.getElementById('manual-url' + slot).value.trim();
    const img = document.getElementById('manual-img' + slot);
    const ph  = document.getElementById('manual-ph' + slot);
    if (url) {
        img.src = url;
        img.style.display = 'block';
        ph.style.display = 'none';
        img.onerror = () => { img.style.display='none'; ph.style.display='flex'; ph.textContent='Bad URL'; };
    } else {
        img.style.display = 'none';
        ph.style.display = 'flex';
        ph.textContent = 'Paste URL below';
    }
}s
</script>

</body>
</html>
