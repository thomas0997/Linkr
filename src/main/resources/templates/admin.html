<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Linkr — Admin</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0d0007;font-family:'Inter',sans-serif;color:#fff;padding:40px}
    h1{font-size:24px;margin-bottom:8px;color:#cc2266}
    .msg{font-size:13px;color:rgba(255,255,255,0.5);margin-bottom:24px}
    .err{color:#ff4444}
    .btn{background:#cc2266;border:none;border-radius:8px;padding:10px 20px;color:#fff;font-size:14px;cursor:pointer;font-weight:600;margin-right:8px}
    .btn.secondary{background:rgba(204,34,102,0.15);border:0.5px solid rgba(204,34,102,0.3)}
    .btn.danger{background:rgba(255,50,50,0.2);border:0.5px solid rgba(255,50,50,0.3)}
    .card{background:rgba(18,0,9,0.9);border:0.5px solid rgba(204,34,102,0.2);border-radius:16px;padding:24px;margin-bottom:24px;max-width:700px}
    .imgs{display:flex;gap:12px;margin-bottom:16px}
    .img-slot{flex:1;aspect-ratio:1;border-radius:12px;overflow:hidden;border:0.5px solid rgba(204,34,102,0.2);max-width:180px}
    .img-slot img{width:100%;height:100%;object-fit:cover}
    .field{margin-bottom:12px;font-size:13px}
    .field label{color:rgba(255,255,255,0.4);font-size:11px;text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:4px}
    .field span{color:#fff}
    .level-input{background:rgba(204,34,102,0.08);border:0.5px solid rgba(204,34,102,0.3);border-radius:8px;padding:8px 12px;color:#fff;font-size:14px;width:80px}
    .actions{display:flex;align-items:center;gap:8px;margin-top:16px}
    input[type=hidden]{}
  </style>
</head>
<body>

  <h1>Linkr Admin Panel</h1>

  <!-- Status message -->
  <p class="msg" th:text="${message}">Ready to generate.</p>
  <p class="msg err" th:if="${error}" th:text="${error}"></p>

  <!-- Generate button -->
  <form method="POST" th:action="@{/admin/generate}" th:if="${generated == null}">
    <button class="btn" type="submit">Generate Question ↗</button>
  </form>

  <!-- Review card — shown after generation -->
  <div class="card" th:if="${generated != null}">

    <!-- Images -->
    <div class="imgs">
      <div class="img-slot"><img th:src="${generated.imageUrl1}" alt="Image 1"></div>
      <div class="img-slot"><img th:src="${generated.imageUrl2}" alt="Image 2"></div>
      <div class="img-slot"><img th:src="${generated.imageUrl3}" alt="Image 3"></div>
    </div>

    <!-- Keywords -->
    <div class="field">
      <label>Image Keywords</label>
      <span th:text="${generated.imageKeyword1 + ' | ' + generated.imageKeyword2 + ' | ' + generated.imageKeyword3}"></span>
    </div>

    <!-- Answer -->
    <div class="field">
      <label>Answer</label>
      <span th:text="${generated.answer}"></span>
    </div>

    <!-- Clues -->
    <div class="field">
      <label>Clue 1</label>
      <span th:text="${generated.clue1}"></span>
    </div>
    <div class="field">
      <label>Clue 2</label>
      <span th:text="${generated.clue2}"></span>
    </div>
    <div class="field">
      <label>Clue 3</label>
      <span th:text="${generated.clue3}"></span>
    </div>

    <!-- Approve form -->
    <form method="POST" th:action="@{/admin/approve}" style="display:inline">
      <input type="hidden" name="answer" th:value="${generated.answer}">
      <input type="hidden" name="imageUrl1" th:value="${generated.imageUrl1}">
      <input type="hidden" name="imageUrl2" th:value="${generated.imageUrl2}">
      <input type="hidden" name="imageUrl3" th:value="${generated.imageUrl3}">
      <input type="hidden" name="clue1" th:value="${generated.clue1}">
      <input type="hidden" name="clue2" th:value="${generated.clue2}">
      <input type="hidden" name="clue3" th:value="${generated.clue3}">
      <div class="actions">
        <div>
          <label style="font-size:12px;color:rgba(255,255,255,0.4)">Level:</label>
          <input class="level-input" type="number" name="levelNumber" min="1" value="1">
        </div>
        <button class="btn" type="submit">✓ Approve</button>
      </div>
    </form>

    <!-- Reject / Regenerate -->
    <div class="actions" style="margin-top:10px">
      <form method="POST" th:action="@{/admin/reject}" style="display:inline">
        <button class="btn danger" type="submit">✗ Reject</button>
      </form>
      <form method="POST" th:action="@{/admin/regenerate}" style="display:inline">
        <button class="btn secondary" type="submit">↺ Regenerate</button>
      </form>
    </div>
  </div>

</body>
</html>
