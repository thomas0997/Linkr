<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Linkr — Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0d0007;font-family:'Inter',sans-serif;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center}
    .card{background:rgba(18,0,9,0.9);border:0.5px solid rgba(204,34,102,0.2);border-radius:20px;padding:40px;text-align:center;max-width:400px;width:100%}
    .avatar{width:72px;height:72px;border-radius:50%;border:2px solid #cc2266;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;color:rgba(255,255,255,0.4)}
    .username{font-size:22px;font-weight:800;margin-bottom:4px}
    .level{font-size:13px;color:#cc2266;margin-bottom:32px}
    .placeholder{background:rgba(204,34,102,0.06);border:0.5px dashed rgba(204,34,102,0.25);border-radius:12px;padding:24px;color:rgba(255,255,255,0.2);font-size:13px;font-style:italic}
    .back{display:inline-block;margin-top:24px;font-size:13px;color:rgba(255,255,255,0.4);text-decoration:none}
    .back:hover{color:#fff}
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">
      <svg width="28" height="28" viewBox="0 0 16 16" fill="none">
        <circle cx="8" cy="5" r="3" stroke="currentColor" stroke-width="1.2"/>
        <path d="M2 14c0-3.314 2.686-5 6-5s6 1.686 6 5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="username" th:text="${player.username}">Username</div>
    <div class="level">Level <span th:text="${player.currentLevel}">1</span> &nbsp;•&nbsp; <span th:text="${player.coins}">0</span> coins</div>
    <div class="placeholder">Stats coming soon — check back shortly.</div>
    <a class="back" href="/home">← Back to home</a>
  </div>
</body>
</html>
