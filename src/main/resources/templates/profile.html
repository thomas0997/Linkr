<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200">
    <title>Linkr — Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0d0007; font-family: 'Inter', sans-serif; color: #fff; min-height: 100vh; }

        .header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 40px;
            background: rgba(10,0,6,0.8); backdrop-filter: blur(16px);
            border-bottom: 0.5px solid rgba(204,34,102,0.15);
        }
        .logo { display: flex; align-items: center; gap: 10px; }
        .logo-box {
            width: 30px; height: 30px; border-radius: 8px; background: #cc2266;
            display: flex; align-items: center; justify-content: center;
        }
        .logo-box svg { width: 15px; height: 15px; }
        .logo-name { font-size: 16px; font-weight: 800; }
        .logo-name em { color: #cc2266; font-style: normal; }
        .header-right { display: flex; align-items: center; gap: 20px; }
        .coin-badge {
            display: flex; align-items: center; gap: 6px;
            background: rgba(204,34,102,0.12); border: 0.5px solid rgba(204,34,102,0.3);
            border-radius: 20px; padding: 5px 14px; font-size: 13px; font-weight: 600;
        }
        .nav-link { font-size: 13px; color: rgba(255,255,255,0.45); text-decoration: none; }
        .nav-link:hover { color: #fff; }

        .page { max-width: 640px; margin: 60px auto; padding: 0 24px; }

        .page-title {
            font-size: 28px; font-weight: 800; margin-bottom: 32px;
            color: #fff;
        }
        .page-title em { color: #cc2266; font-style: normal; }

        .card {
            background: rgba(18,0,9,0.88);
            border: 0.5px solid rgba(204,34,102,0.2);
            border-radius: 16px; padding: 28px 32px;
            margin-bottom: 16px;
        }
        .card-label {
            font-size: 10px; color: rgba(255,255,255,0.3);
            text-transform: uppercase; letter-spacing: .1em; margin-bottom: 6px;
        }
        .card-value { font-size: 22px; font-weight: 700; }
        .card-value.pink { color: #ff2277; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }

        .avatar {
            width: 64px; height: 64px; border-radius: 50%;
            background: linear-gradient(135deg, #cc2266, #660033);
            display: flex; align-items: center; justify-content: center;
            font-size: 26px; font-weight: 800; color: #fff;
            margin-bottom: 12px;
        }
        .username { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
        .username-note { font-size: 12px; color: rgba(255,255,255,0.3); }

        .back-link {
            display: inline-block; margin-top: 24px;
            color: rgba(255,255,255,0.4); font-size: 13px; text-decoration: none;
        }
        .back-link:hover { color: #fff; }
    </style>
</head>
<body>

<div class="header">
    <div class="logo">
        <div class="logo-box">
            <svg viewBox="0 0 15 15" fill="none">
                <circle cx="4" cy="7.5" r="2.5" fill="#fff" opacity=".9"/>
                <circle cx="11" cy="4" r="2.5" fill="#fff" opacity=".6"/>
                <circle cx="11" cy="11" r="2.5" fill="#fff" opacity=".6"/>
                <line x1="6.3" y1="6.1" x2="8.8" y2="4.9" stroke="#fff" stroke-width=".9" opacity=".4"/>
                <line x1="6.3" y1="8.9" x2="8.8" y2="10.1" stroke="#fff" stroke-width=".9" opacity=".4"/>
            </svg>
        </div>
        <a href="/home" style="color:#fff; text-decoration:none;" class="logo-name">Link<em>r</em></a>
    </div>
    <div class="header-right">
        <div class="coin-badge">
            <span th:text="${player.coins}">0</span> Coins 🪙
        </div>
        <a class="nav-link" href="/about">About</a>
        <a class="nav-link" href="/leaderboard">Leaderboard</a>
        <a class="nav-link" href="/">Logout</a>
    </div>
</div>

<div class="page">
    <div class="page-title">My <em>Profile</em></div>

    <!-- Identity -->
    <div class="card">
        <div class="avatar" th:text="${#strings.substring(player.username, 0, 1).toUpperCase()}">T</div>
        <div class="username" th:text="${player.username}">Username</div>
        <div class="username-note" th:if="${player.username.startsWith('Guest[')}">Playing as guest — progress saved to this device</div>
        <div class="username-note" th:unless="${player.username.startsWith('Guest[')}">Registered player</div>
    </div>

    <!-- Stats grid -->
    <div class="stats-grid">
        <div class="card">
            <div class="card-label">Current Level</div>
            <div class="card-value pink" th:text="${player.currentLevel}">1</div>
        </div>
        <div class="card">
            <div class="card-label">Coins</div>
            <div class="card-value" th:text="${player.coins}">0</div>
        </div>
        <div class="card">
            <div class="card-label">Levels Completed</div>
            <div class="card-value" th:text="${levelsCompleted}">0</div>
        </div>
        <div class="card">
            <div class="card-label">Leaderboard Rank</div>
            <div class="card-value pink"
                 th:text="${'#' + (leaderboard.indexOf(player) + 1) + ' / ' + leaderboard.size()}">#1</div>
        </div>
    </div>

    <a class="back-link" href="/home">← Back to home</a>
</div>

</body>
</html>
