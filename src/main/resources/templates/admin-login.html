<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Linkr — Admin Login</title>
<style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0d0007;font-family:'Inter',sans-serif;color:#fff;
        display:flex;align-items:center;justify-content:center;min-height:100vh}
    .card{background:rgba(18,0,9,0.95);border:0.5px solid rgba(204,34,102,0.25);
        border-radius:20px;padding:48px 40px;width:100%;max-width:380px;text-align:center}
    .logo{font-size:22px;font-weight:800;color:#cc2266;margin-bottom:8px}
    h2{font-size:18px;font-weight:600;margin-bottom:6px}
    .sub{font-size:13px;color:rgba(255,255,255,0.4);margin-bottom:32px}
    .code-input{
    width:100%;background:rgba(204,34,102,0.06);
    border:0.5px solid rgba(204,34,102,0.3);border-radius:10px;
    padding:16px;font-size:28px;font-weight:700;letter-spacing:12px;
    color:#fff;text-align:center;outline:none;font-family:'Inter',sans-serif;
    }
    .code-input:focus{border-color:#cc2266}
    .btn{width:100%;margin-top:16px;background:#cc2266;border:none;border-radius:10px;
        padding:14px;font-size:15px;font-weight:700;color:#fff;cursor:pointer}
    .btn:hover{background:#ff2277}
    .btn:disabled{opacity:0.4;cursor:not-allowed}
    .err{color:#ff4444;font-size:13px;margin-top:16px}
    .ok{color:#44ff99;font-size:13px;margin-top:16px}
</style>
</head>
<body>
<div class="card">
<div class="logo">Link<span style="color:#fff">r</span></div>
<h2>Admin Login</h2>
<p class="sub">Enter the 6-digit code from Google Authenticator</p>

<form method="POST" th:action="@{/admin/login-process}" id="loginForm">
    <input class="code-input" type="text" name="code" id="code"
        maxlength="6" placeholder="······" autocomplete="off"
        inputmode="numeric" pattern="[0-9]{6}" required
        th:disabled="${blocked}">
    <button class="btn" type="submit" th:disabled="${blocked}">Verify ↗</button>
</form>

<p class="err" th:if="${error}" th:text="${error}"></p>
<p class="ok"  th:if="${message}" th:text="${message}"></p>
</div>

<script>
// Auto-submit when 6 digits are typed
document.getElementById('code').addEventListener('input', function() {
    if (this.value.replace(/\D/g, '').length === 6) {
    this.value = this.value.replace(/\D/g, '');
    document.getElementById('loginForm').submit();
    }
});
</script>
</body>
</html>
